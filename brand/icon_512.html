<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>icon source</title>
<style>
  /* 512x512 Discord server icon source — screenshot with headless Edge.
     Discord circle-crops: everything meaningful stays in the center circle. */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 512px; height: 512px; overflow: hidden; }
  body {
    background:
      radial-gradient(ellipse 110% 55% at 50% 118%, #1a1610 0%, transparent 65%),
      #0e1116;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  /* inset plate ring — subtle at full size, gone at 32px, fine both ways */
  .ring {
    position: absolute;
    inset: 14px;
    border: 2px solid #272e38;
    border-radius: 50%;
  }
  .hcv {
    font-family: Consolas, monospace;
    font-size: 44px;
    letter-spacing: 0.55em;
    margin-left: 0.55em; /* recenter: letter-spacing trails the last glyph */
    color: #c05f35;
    margin-bottom: 6px;
  }
  .reg {
    font-family: "Arial Black", sans-serif;
    font-weight: 900;
    font-size: 150px;
    line-height: 1;
    letter-spacing: -0.02em;
    color: #dde1e6;
  }
  .bar {
    margin-top: 26px;
    width: 210px;
    height: 12px;
    background: #c05f35;
  }
</style>
</head>
<body>
  <div class="ring"></div>
  <div class="hcv">HCV</div>
  <div class="reg">2666</div>
  <div class="bar"></div>
</body>
</html>
